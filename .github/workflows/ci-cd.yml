name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/backend
  FRONTEND_IMAGE: ${{ github.repository }}/frontend

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install backend dependencies
      run: |
        cd backend
        npm ci

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Run backend tests
      run: |
        cd backend
        npm test -- --coverage --watchAll=false

    - name: Run frontend tests
      run: |
        cd frontend
        npm run test:run

    - name: Run linting
      run: |
        cd frontend
        npm run lint

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for backend
      id: meta-backend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ steps.meta-backend.outputs.tags }}
        labels: ${{ steps.meta-backend.outputs.labels }}

    - name: Extract metadata for frontend
      id: meta-frontend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Update kube config
      run: aws eks update-kubeconfig --name syra-staging-cluster

    - name: Deploy to staging
      run: |
        # Update backend deployment
        sed -i 's|image:.*|image: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest|g' k8s/staging/backend-deployment.yaml
        kubectl apply -f k8s/staging/

        # Wait for rollout
        kubectl rollout status deployment/backend -n syra-staging

        # Run health checks
        kubectl run health-check --image=curlimages/curl --rm -i --restart=Never -- curl -f http://backend.syra-staging.svc.cluster.local/api/health

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Update kube config
      run: aws eks update-kubeconfig --name syra-production-cluster

    - name: Blue-Green Deployment
      run: |
        # Check current active deployment
        ACTIVE=$(kubectl get svc backend -n syra-production -o jsonpath='{.spec.selector.version}')

        if [ "$ACTIVE" = "blue" ]; then
          TARGET="green"
          PREVIOUS="blue"
        else
          TARGET="green"
          PREVIOUS="blue"
        fi

        # Deploy to inactive version
        sed -i "s/version: blue/version: $TARGET/g" k8s/production/backend-deployment.yaml
        sed -i 's|image:.*|image: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest|g' k8s/production/backend-deployment.yaml
        kubectl apply -f k8s/production/

        # Wait for rollout
        kubectl rollout status deployment/backend-$TARGET -n syra-production

        # Health check
        kubectl run health-check --image=curlimages/curl --rm -i --restart=Never -- curl -f http://backend-$TARGET.syra-production.svc.cluster.local/api/health

        # Switch traffic
        kubectl patch svc backend -n syra-production -p "{\"spec\":{\"selector\":{\"version\":\"$TARGET\"}}}"

        # Wait and verify
        sleep 30
        kubectl run verify-check --image=curlimages/curl --rm -i --restart=Never -- curl -f http://backend.syra-production.svc.cluster.local/api/health

        # Scale down previous version
        kubectl scale deployment backend-$PREVIOUS -n syra-production --replicas=0
